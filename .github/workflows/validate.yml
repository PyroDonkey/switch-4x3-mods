# Tripwire: reports game data, keys or decompiler dumps that reached GitHub. It can't stop a push;
# the pre-commit hook (.githooks) is the preventive layer. See docs/game-files-policy.md.
name: Check repo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_repo.py

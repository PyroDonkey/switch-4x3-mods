# Publishes a GitHub release when a <game>-v<version> tag is pushed (scripts/release.py publish pushes it).
# Re-running the workflow is safe: an existing release gets its zip replaced.
name: Release

on:
  push:
    tags: ['*-v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check and package
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py ci "$TAG"

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            pre=()
            if [ -f dist/prerelease ]; then pre=(--prerelease); fi
            gh release create "$TAG" --verify-tag --latest=false "${pre[@]}" \
              --title "$(cat dist/title.txt)" --notes-file dist/notes.md dist/*.zip
          fi
